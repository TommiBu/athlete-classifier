<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Detail hráče</title>
    <style>
        body { font-family: Arial, sans-serif; background: #F0F2F5; margin: 0; color: #333; }
        .hdr { background: linear-gradient(135deg,#1F4E79,#2E75B6); color: white; padding: 20px 28px; }
        .hdr h1 { margin: 0 0 4px; font-size: 20px; }
        .content { max-width: 700px; margin: 24px auto; padding: 0 16px; }
        .card { background: white; border-radius: 12px; padding: 24px; border: 1px solid #DDD; margin-bottom: 16px; }
        .profil { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
        .section { font-size: 12px; font-weight: 700; color: #1F4E79; margin: 16px 0 8px;
            border-left: 4px solid #2E75B6; padding-left: 8px; }
        .row { display: flex; justify-content: space-between; padding: 6px 0;
            border-bottom: 1px solid #F5F5F5; font-size: 13px; }
        .label { color: #888; }
        .val { font-weight: 600; }
        .warn { color: #E24B4A; }
        .back { display: inline-block; margin-bottom: 16px; color: #2E75B6;
            text-decoration: none; font-size: 13px; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="hdr">
    <h1>Detail hráče</h1>
</div>
<div class="content">
    <a class="back" href="/">← Zpět na přehled</a>
    <div class="card" th:if="${athlete}">
        <div class="profil" th:style="'color:' + (${athlete.quadrant == 'Q1'} ? '#1D9E75' :
      ${athlete.quadrant == 'Q2'} ? '#EF9F27' :
      ${athlete.quadrant == 'Q3'} ? '#378ADD' : '#E24B4A')"
             th:text="${athlete.profil}"></div>
        <div style="font-size:12px;color:#888;margin-bottom:16px;" th:text="${athlete.athleteId}"></div>

        <div class="section">Wingate — výkonové parametry</div>
        <div class="row"><span class="label">Peak Power</span><span class="val" th:text="${#numbers.formatDecimal(athlete.peakPowerW,1,0)} + ' W'"></span></div>
        <div class="row"><span class="label">Mean Power</span><span class="val" th:text="${#numbers.formatDecimal(athlete.meanPowerW,1,0)} + ' W'"></span></div>
        <div class="row"><span class="label">Fatigue Index</span><span class="val" th:text="${#numbers.formatDecimal(athlete.fatigueIndex,1,1)} + ' %'"></span></div>
        <div class="row"><span class="label">Time to Peak</span><span class="val" th:text="${#numbers.formatDecimal(athlete.timeToPeakS,1,2)} + ' s'"></span></div>

        <div class="section">Klasifikace</div>
        <div class="row"><span class="label">pp/smm</span><span class="val" th:text="${#numbers.formatDecimal(athlete.ppPerSmm,1,2)} + ' W/kg'"></span></div>
        <div class="row"><span class="label">FI/Mean</span><span class="val" th:text="${#numbers.formatDecimal(athlete.fiMeanRatio,1,2)}"></span></div>
        <div class="row"><span class="label">Kvadrant</span><span class="val" th:text="${athlete.quadrant}"></span></div>
        <div class="row"><span class="label">Profil</span><span class="val" th:text="${athlete.profil}"></span></div>

        <div class="section">BIA — tělesné složení</div>
        <div class="row"><span class="label">SMM</span><span class="val" th:text="${#numbers.formatDecimal(athlete.smmKg,1,1)} + ' kg'"></span></div>
        <div class="row"><span class="label">Fázový úhel</span>
            <span th:class="${athlete.pha < 6.5} ? 'val warn' : 'val'"
                  th:text="${#numbers.formatDecimal(athlete.pha,1,1)} + '°'"></span>
        </div>
        <div class="row"><span class="label">ECW/TBW</span>
            <span th:class="${athlete.ecw / athlete.tbw >= 0.380} ? 'val warn' : 'val'"
                  th:text="${#numbers.formatDecimal(athlete.ecw / athlete.tbw,1,3)}"></span>
        </div>
    </div>
</div>
</body>
</html>
